name: Deploy to Alexa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Add Alexa-hosted remote with credential helper
        run: |
          git remote remove alexa 2>/dev/null || true
          git remote add alexa "${{ secrets.ALEXA_HOSTED_REPO_URL }}"
          git config "credential.https://git-codecommit.us-east-1.amazonaws.com/v1/repos/fbcd5041-3c81-4e6c-9bce-3762fa0226a9".helper ""
          git config "credential.https://git-codecommit.us-east-1.amazonaws.com/v1/repos/fbcd5041-3c81-4e6c-9bce-3762fa0226a9".helper "!$HOME/.ask/scripts/git-credential-helper default amzn1.ask.skill.fbcd5041-3c81-4e6c-9bce-3762fa0226a9"
          git config "credential.https://git-codecommit.us-east-1.amazonaws.com/v1/repos/fbcd5041-3c81-4e6c-9bce-3762fa0226a9".UseHttpPath true

      - name: Push to Alexa-hosted master branch
        run: |
          git push --no-verify alexa main:master
